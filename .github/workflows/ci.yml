jobs: # Jobs (required)
    ci:
        name: CI - ${{ matrix.rust }}
        runs-on: ubuntu-latest
        strategy:
            matrix:
                rust: [stable, "1.93.1"] # stable + MSRV

        steps:
            - uses: actions/checkout@v4

            - name: Install Rust ${{ matrix.rust }}
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ matrix.rust }}
                  # llvm-tools-preview is the Rust component that cargo-llvm-cov
                  # wraps; it must be present before the coverage step runs.
                  # rustfmt + clippy are only used on stable (gated below), but
                  # installing them on MSRV too is harmless and avoids a second
                  # toolchain action call.
                  components: rustfmt, clippy, llvm-tools-preview

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry/index
                      ~/.cargo/registry/cache
                      ~/.cargo/git/db
                      target
                  key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.toml') }}
                  restore-keys: ${{ runner.os }}-cargo-${{ matrix.rust }}-

            - name: Format check
              if: matrix.rust == 'stable'
              run: cargo fmt --all -- --check

            - name: Install nightly rustfmt
              if: matrix.rust == 'stable'
              uses: dtolnay/rust-toolchain@nightly
              with:
                  components: rustfmt

            - name: Format check
              if: matrix.rust == 'stable'
              run: cargo +nightly fmt --all -- --check

            - name: Clippy
              if: matrix.rust == 'stable'
              run: cargo clippy --all-targets -- -D warnings

            - name: Build (release)
              run: cargo build --release

            - name: Tests (offline stub mode)
              run: SKIP_LLM=1 cargo test --workspace

            - name: Install cargo-llvm-cov
              if: matrix.rust == 'stable'
              uses: taiki-e/install-action@v2
              with:
                  # taiki-e/install-action installs the cargo-llvm-cov *binary*;
                  # the llvm-tools-preview *component* is handled above in the
                  # dtolnay/rust-toolchain step so both halves are present.
                  tool: cargo-llvm-cov

            - name: Coverage (llvm-cov)
              if: matrix.rust == 'stable'
              run: |
                  SKIP_LLM=1 cargo llvm-cov \
                    --workspace \
                    --lcov --output-path lcov.info \
                    --ignore-filename-regex 'tests/'
                  SKIP_LLM=1 cargo llvm-cov report \
                    --html --output-dir coverage-html

            - name: Upload coverage report (HTML artifact)
              if: matrix.rust == 'stable'
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-html
                  path: coverage-html/
                  retention-days: 30

            - name: Upload lcov to Codecov
              if: matrix.rust == 'stable'
              uses: codecov/codecov-action@v5
              # continue-on-error keeps CI green until CODECOV_TOKEN is added
              # to repo secrets (Settings → Secrets → Actions → New secret).
              # Remove once the token is configured.
              continue-on-error: true
              with:
                  files: lcov.info
                  fail_ci_if_error: false # don't break CI on Codecov outages
                  token: ${{ secrets.CODECOV_TOKEN }}

            - name: Docs
              if: matrix.rust == 'stable'
              env:
                  RUSTDOCFLAGS: "--cfg docsrs -D warnings"
              run: cargo doc --no-deps

