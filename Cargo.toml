[package]
name        = "polar-bear-rig-hft"
version     = "0.1.0"
edition     = "2024"
rust-version = "1.93.1"
authors     = ["Murtaza Ali Imtiaz <very.kool.king@gmail.com>"]
description = "LLM-driven high-frequency trading platform on Solana - PEV loop, Smart Order Routing, SignerContext keypair isolation, and AVM benchmarking via Rig (ARC)"
repository  = "https://github.com/murtazaai/polar-bear-rig-hft"
homepage    = "https://www.murtazaai.com"
documentation = "https://docs.rs/polar-bear-rig-hft"
license     = "MIT OR Apache-2.0"
keywords    = ["hft", "rig", "solana", "agent", "defi"]
categories  = ["finance", "asynchronous"]
readme      = "README.md"

# ── Publish control ───────────────────────────────────────────────
# Only ship what library consumers need; keep IDE config, internal
# docs, and toolchain files out of the published crate.
exclude = [
    ".env",
    ".env.example",
    ".clippy.toml",
    ".gitignore",
    ".github/",
    ".zed/",
    "docs/",
    "BUG-FIXES.md",
    "FILE_STRUCTURE.md",
    "LICENSE-PBS",
    "Cargo.lock",
]

# ── Docs.rs ───────────────────────────────────────────────────────
# Build all features, inject the docsrs cfg flag so conditional items
# are visible, and silence the doctest runner (all examples use no_run).
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# ── Binary target ─────────────────────────────────────────────────
[[bin]]
name = "polar-bear-rig-hft"
path = "src/main.rs"

# ── Library target ────────────────────────────────────────────────
[lib]
name = "polar_bear_rig_hft"
path = "src/lib.rs"

# ── Workspace-wide lints (mirrors rig upstream lint table) ────────
[lints.rust]
unused       = "warn"
missing_docs = "warn"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Suppress common false-positive pedantic lints.
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"

# ── Core AI / Agent Framework ─────────────────────────────────────
[dependencies]
rig-core = "^0.36"

# ── Async Runtime ─────────────────────────────────────────────────
tokio = { version = "^1", features = ["full"] }

# ── Solana SDK ────────────────────────────────────────────────────
solana-client  = "^3"
solana-sdk     = "^3"
solana-program = "^3"
spl-token      = "^9"

# ── Cryptography ──────────────────────────────────────────────────
ed25519-dalek = { version = "^2", features = ["rand_core"] }
k256          = { version = "^0.13", features = ["ecdsa", "sha256"] }
sha2          = "^0.10"
rand          = "^0.8"

# ── Serialization ─────────────────────────────────────────────────
serde      = { version = "^1", features = ["derive"] }
serde_json = "^1"

# ── HTTP / TLS ────────────────────────────────────────────────────
# rustls is also pulled in via the default feature chain in reqwest 0.13;
# listing it explicitly documents the intent and avoids an OpenSSL dependency.
reqwest = { version = "^0.13", features = ["json", "rustls"] }

# ── CLI ───────────────────────────────────────────────────────────
clap = { version = "^4", features = ["derive"] }

# ── Logging ───────────────────────────────────────────────────────
tracing            = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }

# ── Error Handling ────────────────────────────────────────────────
anyhow    = "^1"
thiserror = "^2"

# ── Environment Config ────────────────────────────────────────────
dotenvy = "^0.15"

# ── Dev / Test ────────────────────────────────────────────────────
[dev-dependencies]
tokio-test = "^0.4"
mockall    = "^0.13"

# ── Release Profile ───────────────────────────────────────────────
# Maximise performance and minimise binary size through LTO and
# single-codegen-unit compilation.  Mirrors the rig workspace profile.
[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"
strip         = "debuginfo"
