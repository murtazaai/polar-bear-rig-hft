name: CI # Workflow display name
# run-name: ${{ github.actor }} triggered  # Run display name

on: # Triggers (required)
    push:
        branches: [main, master] # [main, dev]
        # branches-ignore: [temp/**]
        #     tags: ['v*']
        #     paths: ['src/**']

    pull_request:
        # types: [opened, synchronize, reopened]
        branches: [main, master]
