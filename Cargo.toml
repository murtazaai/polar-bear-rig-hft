[package]
name    = "polar-bear-rig-hft"
version = "0.1.0"
edition = "2021"
description = "Optimal HFT platform using Rig (Rust Inference Gateway / ARC)"
repository  = "https://github.com/murtazaai/polar-bear-rig-hft"
license     = "GPL-3.0"

[[bin]]
name = "polar-bear-rig-hft"
path = "src/main.rs"

# ── CORE RIG (ARC) ────────────────────────────────────────────────
[dependencies]
rig-core = { version = "^0.9.1" }

# Uncomment when rig-onchain-kit is published to crates.io
# rig-onchain-kit = { version = "0.1", features = ["full"] }
# For now: clone from github.com/0xPlaygrounds/rig and use path dependency:
# rig-onchain-kit = { path = "../rig-onchain-kit" }

# ── ASYNC RUNTIME ─────────────────────────────────────────────────
tokio = { version = "^1",   features = ["full"] }
futures = "^0.3"

# ── SOLANA ────────────────────────────────────────────────────────
solana-client   = "^3"
solana-sdk      = "^3"
solana-program  = "^3"
spl-token       = "^9"

# ── CRYPTOGRAPHY ──────────────────────────────────────────────────
ed25519-dalek   = { version = "^2", features = ["rand_core"] }
k256            = { version = "^0.13", features = ["ecdsa", "sha256"] }
sha2            = "^0.10"
rand            = "^0.8"

# ── SERIALIZATION ─────────────────────────────────────────────────
serde            = { version = "^1", features = ["derive"] }
serde_json       = "^1"

# ── HTTP / APIs ───────────────────────────────────────────────────
reqwest  = { version = "^0.12", features = ["json", "rustls-tls"] }

# ── CLI ───────────────────────────────────────────────────────────
clap     = { version = "^4", features = ["derive"] }

# ── LOGGING ───────────────────────────────────────────────────────
tracing             = "^0.1"
tracing-subscriber  = { version = "^0.3", features = ["env-filter"] }

# ── ERROR HANDLING ────────────────────────────────────────────────
anyhow  = "^1"
thiserror = "^1"

# ── ENV CONFIG ────────────────────────────────────────────────────
dotenvy = "^0.15"

[dev-dependencies]
tokio-test = "^0.4"
mockall    = "^0.12"

[profile.release]
opt-level = 3
lto       = true
codegen-units = 1
panic     = "abort"
